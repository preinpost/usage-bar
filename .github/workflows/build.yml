name: build

# Reusable 5-target build (Linux amd64/arm64, macOS arm64, Windows amd64/arm64) —
# all native runners, no QEMU or zig needed.
# Called by `ci.yml` (master pushes → nightly) and `release.yml` (tags → release).
on:
  workflow_call:
    inputs:
      ref:
        description: git ref to check out and build
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: macos-15
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-amd64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            name: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Build
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" --locked
      # macOS refuses to run unsigned binaries — ad-hoc signature
      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force -s - "target/${{ matrix.target }}/release/ub"
      - name: Package
        shell: bash
        run: |
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cp "target/${{ matrix.target }}/release/ub$ext" "ub-${{ matrix.name }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: ub-${{ matrix.name }}
          path: ub-${{ matrix.name }}*
          if-no-files-found: error
