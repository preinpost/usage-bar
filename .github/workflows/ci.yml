name: ci

# Every push to main builds the 6 binaries and refreshes the rolling
# `nightly` release, so the latest main is always downloadable.
# Versioned releases stay manual: Actions → "bump & release".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo test --locked

  nightly:
    name: Update nightly release
    needs: [build, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Refresh rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha_short=$(git rev-parse --short HEAD)
          # replace the previous nightly release + its movable tag
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag || true
          fi
          git tag -f nightly HEAD
          git push origin nightly --force
          gh release create nightly dist/* \
            --title "nightly (main @ $sha_short)" \
            --notes "Auto-built from main@$sha_short. Versioned releases: Actions → **bump & release**." \
            --latest=false
