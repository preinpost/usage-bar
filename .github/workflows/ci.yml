name: ci

# Every push to master validates all 5 build targets and runs the test suite.
# Nothing is published here — versioned binaries ship via the manual
# Actions → "bump & release" workflow.

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: .
      - run: cargo test --locked
