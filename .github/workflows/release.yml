name: bump & release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit version (e.g. "1.2.3"); empty = auto bump'
        required: false
        default: ''
      bump:
        description: 'Auto-bump level (used when version is empty)'
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: bump-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  bump:
    name: Bump version & tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Bump, commit, tag, push
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ver=$(python3 .github/bump.py "${{ inputs.version }}" "${{ inputs.bump }}" "${{ github.ref_name }}")
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - name: Confirm
        run: echo "releasing v${{ steps.bump.outputs.version }}"

  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: v${{ needs.bump.outputs.version }}
    needs: bump

  release:
    name: Create GitHub release
    needs: [bump, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: v${{ needs.bump.outputs.version }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Build release notes
        run: |
          prev=$(git tag --sort=-version:refname | sed -n '2p')
          { echo "## What's changed"; echo; } > notes.md
          if [ -n "$prev" ]; then
            git log --oneline --no-decorate "$prev"..HEAD >> notes.md || true
          else
            git log --oneline --no-decorate >> notes.md || true
          fi
          echo "--- notes ---"
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.bump.outputs.version }}
          name: v${{ needs.bump.outputs.version }}
          body_path: notes.md
          files: dist/*
