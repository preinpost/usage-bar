[package]
name = "usage-bar"
version = "0.1.8"
edition = "2024"

# installed/invoked as `ub`; package & crate keep the `usage-bar` name
[[bin]]
name = "ub"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", features = ["json"] }
walkdir = "2.5"
toml = "0.9"
# Chrome cookie decryption (OpenRouter web-dashboard sync)
#   macOS: Keychain password -> PBKDF2 -> AES-128-CBC
#   Windows: Local State os_crypt -> DPAPI -> AES-256-GCM
base64 = "0.22"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = "0.12"
aes-gcm = "0.10"
keyring = "4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

[profile.release]
lto = true
strip = true
