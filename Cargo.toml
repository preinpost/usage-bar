[package]
name = "usage-bar"
version = "0.1.3"
edition = "2024"

# installed/invoked as `ub`; package & crate keep the `usage-bar` name
[[bin]]
name = "ub"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "3.4", features = ["json"] }
walkdir = "2.5"
toml = "0.9"
# Chrome cookie decryption (OpenRouter web-dashboard sync)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
hmac = "0.12"
sha1 = "0.10"
pbkdf2 = "0.12"

[profile.release]
lto = true
strip = true
